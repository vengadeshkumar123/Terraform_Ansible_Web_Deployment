---
- name: Deploy Festival Website
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Copy website files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../web/FestavaLive-1.0.0/"
        dest: /var/www/html/
        owner: root
        group: root
        mode: preserve