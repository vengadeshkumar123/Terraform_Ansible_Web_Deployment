name: Terraform and Ansible Deployment

on:
  push:
    branches:
      - main
  
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Get EC2 public IP
        id: ec2
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/practice.pem
          chmod 600 ~/.ssh/practice.pem

      - name: Deploy website with Ansible
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
        run: |
          ansible-playbook \
            -i "$EC2_IP," \
            ansible/deploy.yaml \
            -u ubuntu \
            --private-key ~/.ssh/practice.pem \
            --ssh-extra-args="-o StrictHostKeyChecking=no"